name: Build and test

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore LockRun.sln

      - name: Build
        run: dotnet build LockRun.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/LockRun.Tests/LockRun.Tests.csproj --configuration Release --no-build --no-restore

      - name: Publish win-x64
        run: >-
          dotnet publish src/LockRun/LockRun.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          --output publish/LockRun-win-x64

      - name: Package artifact
        shell: pwsh
        run: Compress-Archive -Path publish/LockRun-win-x64/* -DestinationPath LockRun-win-x64.zip -Force

      - name: Sanity check artifact
        shell: pwsh
        run: |
          $zipPath = "LockRun-win-x64.zip"
          $extractPath = "artifact-check/LockRun-win-x64"

          New-Item -ItemType Directory -Path $extractPath -Force | Out-Null
          Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force

          $exePath = Join-Path $extractPath "LockRun.exe"
          if (-not (Test-Path $exePath)) {
            throw "LockRun.exe was not found in the artifact zip."
          }

          if ((Get-Item $exePath).Length -le 0) {
            throw "LockRun.exe is empty."
          }

          $settingsPath = Join-Path $extractPath "appsettings.json"
          if (-not (Test-Path $settingsPath)) {
            throw "appsettings.json was not found in the artifact zip."
          }

          Get-Content -Raw -Path $settingsPath | ConvertFrom-Json | Out-Null

      - name: Create checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "LockRun-win-x64.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  LockRun-win-x64.zip" | Set-Content "LockRun-win-x64.zip.sha256" -Encoding ascii

      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@v4
        with:
          subject-path: LockRun-win-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: LockRun-win-x64
          path: |
            LockRun-win-x64.zip
            LockRun-win-x64.zip.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: LockRun-win-x64
          path: release

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $releaseZip = "release/LockRun-$tag-win-x64.zip"
          Move-Item "release/LockRun-win-x64.zip" $releaseZip -Force

          $hash = (Get-FileHash $releaseZip -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumPath = "$releaseZip.sha256"
          "$hash  $(Split-Path $releaseZip -Leaf)" | Set-Content $checksumPath -Encoding ascii

          $version = $tag.TrimStart("v")
          $changelog = Get-Content "CHANGELOG.md"
          $heading = "## $version"
          $start = [Array]::FindIndex($changelog, [Predicate[string]] {
            param($line)
            $line.StartsWith($heading, [StringComparison]::Ordinal)
          })

          if ($start -lt 0) {
            throw "CHANGELOG.md does not contain a section for $version."
          }

          $end = $changelog.Length
          for ($index = $start + 1; $index -lt $changelog.Length; $index++) {
            if ($changelog[$index].StartsWith("## ", [StringComparison]::Ordinal)) {
              $end = $index
              break
            }
          }

          $notesPath = "release/release-notes.md"
          $changelog[($start + 1)..($end - 1)] | Set-Content $notesPath -Encoding utf8

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $releaseZip $checksumPath --clobber
          }
          else {
            gh release create $tag $releaseZip $checksumPath --verify-tag --notes-file $notesPath --title "Lock & Run $tag"
          }
