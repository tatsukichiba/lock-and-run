name: .NET Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore AIAwayGuard.sln

      - name: Build
        run: dotnet build AIAwayGuard.sln --configuration Release --no-restore

      - name: Publish win-x64
        run: dotnet publish src/AIAwayGuard/AIAwayGuard.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/AIAwayGuard-v0.1.0-win-x64

      - name: Package artifact
        shell: pwsh
        run: Compress-Archive -Path publish/AIAwayGuard-v0.1.0-win-x64/* -DestinationPath AIAwayGuard-v0.1.0-win-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIAwayGuard-v0.1.0-win-x64
          path: AIAwayGuard-v0.1.0-win-x64.zip
